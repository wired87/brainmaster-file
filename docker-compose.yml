services:
  brainmaster-file:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: brainmaster-file:latest
    container_name: brainmaster-file
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Transport is set via CMD in the Dockerfile.
      # Override here if needed, e.g.:
      # MCP_TRANSPORT: stdio
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
